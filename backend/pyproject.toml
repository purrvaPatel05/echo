[project]
name = "echo-backend"
version = "0.1.0"
description = "ECHO backend core: case parsing, specialist matching, referrals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "anthropic>=1.7.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
