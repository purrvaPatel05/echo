name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true, cache-dependency-glob: backend/uv.lock }
      # Python comes from backend/.python-version (3.12); dependencies from the committed uv.lock.
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Includes the migration check (alembic upgrade + `alembic check`), the ECHO frontend-contract
      # tests (/api/echo/*), and a check that the root config files match the backend's settings.
      - run: uv run pytest -q
      - name: backend/openapi.json is up to date
        run: uv run python -m app.export_openapi && git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      # `gen:api` reads the REPO-ROOT openapi.json, which is the old prototype API and is kept frozen
      # for the frontend's legacy client types (src/api/client.ts). The backend's own spec is
      # backend/openapi.json, checked in the backend job above. When the legacy client is retired,
      # point `gen:api` at ../backend/openapi.json and delete the root file.
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run build
