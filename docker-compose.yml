# Local Postgres + Redis for development. `docker compose up -d`, then from backend/:
#   uv run alembic upgrade head && uv run python -m app.seed
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo
      POSTGRES_DB: echo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
